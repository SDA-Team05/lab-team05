apiVersion: apps/v1
kind: Deployment
metadata:
  name: g05-lab04
  namespace: mzinga-lab4
  labels:
    app: g05-lab04
spec:
  replicas: 3
  selector:
    matchLabels:
      app: g05-lab04
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: g05-lab04
        version: v2
    spec:
      containers:
        - name: g05-lab04
          image: mzinga-g05-lab04:2.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: APP_COLOR
              value: "green"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"